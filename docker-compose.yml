services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-demo-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PASSWORD=demo_password_123
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
