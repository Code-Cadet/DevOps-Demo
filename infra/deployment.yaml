apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-api
        image: my-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env: # This section injects your secret as an environment variable
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-secrets
                key: DB_PASSWORD